services:
  redis:
    image: redis:7-alpine
    container_name: phishnet-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phishnet-network

  db:
    image: postgres:15-alpine
    container_name: phishnet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishnet}
      POSTGRES_USER: ${POSTGRES_USER:-phishnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishnet} -d ${POSTGRES_DB:-phishnet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - phishnet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishnet-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-phishnet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-phishnet}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      # SMTP — configure to match your mail provider (e.g. Mailtrap, SendGrid, SES)
      MAIL_SERVER: ${MAIL_SERVER:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-phishnet@company.com}
      # Public base URL used to build tracking links embedded in phishing emails
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    volumes:
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - phishnet-network
    command: >
      sh -c "
        if [ ! -f 'migrations/env.py' ]; then
          echo 'Initializing migrations...' &&
          rm -rf migrations/* &&
          flask db init &&
          echo 'Creating initial migration...' &&
          flask db migrate -m 'Initial migration' &&
          echo 'Applying migrations...' &&
          flask db upgrade;
        else
          echo 'Migrations folder exists, running upgrade...' &&
          flask db upgrade || (
            echo 'Migration failed, creating new migration...' &&
            flask db migrate -m 'Auto migration' &&
            flask db upgrade
          );
        fi &&
        echo 'Seeding built-in templates...' &&
        flask seed-templates &&
        echo 'Starting application...' &&
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 --access-logfile - --error-logfile - wsgi:app
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishnet-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phishnet-network

networks:
  phishnet-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
